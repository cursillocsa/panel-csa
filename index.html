<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel CSA · Gauss</title>
<style>
.cs-tb{width:100%;border-collapse:collapse;font-size:13px}.cs-tb th{background:#d9e2f3;text-align:left;padding:6px;white-space:nowrap}.cs-tb td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}.cs-tb td.n,.cs-tb th.n{text-align:right;white-space:nowrap}
.cs-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.cs-k{background:#f3f5f9;border-radius:10px;padding:10px}.cs-k span{font-size:11px;color:#666;text-transform:uppercase;display:block}.cs-k b{font-size:19px}
.cs-sem{display:flex;gap:6px;flex-wrap:wrap}.cs-sem button{flex:1;min-width:120px;border:1px solid #bbb;background:#fff;border-radius:18px;padding:8px 10px;font-size:14px;cursor:pointer;font-family:inherit}.cs-sem button.on{background:#1f4e79;color:#fff;border-color:#1f4e79}
.cs-al{color:#1155cc;cursor:pointer;text-decoration:underline}

:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--azul:#1f4e79}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:16px}
header{background:var(--azul);color:#fff;padding:14px 16px;border-bottom:4px solid var(--rojo);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;flex:1}header h1 span{color:#ffd27a}
#volver{display:none;background:#0d2f4f;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
main{padding:14px 16px 70px;max-width:860px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--azul)}
.botones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bgrande{display:block;text-align:left;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:bold;cursor:pointer;color:#fff;min-height:96px;font-family:inherit}
.bgrande small{display:block;font-weight:normal;font-size:13px;opacity:.9;margin-top:6px}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
label .req{color:var(--rojo)}
input,select,textarea{width:100%;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;background:#fff;font-family:inherit}
.fila2{display:flex;gap:12px}.fila2>div{flex:1;min-width:0}
@media(max-width:600px){.fila2{flex-direction:column;gap:0}}
.btn{display:block;width:100%;font-size:18px;padding:14px;background:var(--rojo);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:bold;margin-top:16px;font-family:inherit}
.btn:disabled{opacity:.6}.btn.az{background:var(--azul)}.btn.gr{background:#666}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acc{border:0;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
.ayuda{color:#777;font-size:13px;font-weight:normal}
.err{color:var(--rojo);font-weight:bold;margin-top:10px}
.res div{padding:11px 12px;border:1px solid #eee;border-radius:8px;margin-top:6px;cursor:pointer}
.res div:hover{background:#e8f0fe}.res small{color:#777}
.aviso{background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.ok{background:#d9ead3;border-radius:12px;padding:16px}
.ok b.big{font-size:20px;display:block;margin-bottom:6px}
#msg{color:#666;text-align:center;margin-top:30px}
.paso{display:inline-block;background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:6px;font-size:14px}
.elegido{background:#e8f0fe;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font-size:14px;padding:7px 12px;border:0;border-radius:8px;background:#666;color:#fff;cursor:pointer}
.nom{font-size:21px;font-weight:bold;margin:0}
.sub{color:#555;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.k{background:#f3f5f9;border-radius:8px;padding:8px}
.k b{display:block;font-size:19px;margin-top:2px}
.k span{font-size:11px;color:#666;text-transform:uppercase}
.dato{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid #f0f0f0}
.dato span{color:#666;min-width:130px;font-size:13px}
.sem{font-size:30px}
.r{background:#f4cccc}.y{background:#fff2cc}.g{background:#d9ead3}.gris{color:#999}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#d9e2f3;text-align:left;padding:5px;position:sticky;top:0}
td{padding:5px;border-bottom:1px solid #eee;vertical-align:top}
tr.clic{cursor:pointer}tr.clic:hover td{background:#e8f0fe}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:7px 12px;border-radius:18px;margin:6px 6px 0 0;font-weight:bold;font-size:13px}
.vacio{color:#999;font-style:italic}
header h1 span.tit{color:inherit}h1 .tit{cursor:pointer;-webkit-tap-highlight-color:transparent}h1 .tit:active{opacity:.6}
</style></head><body>
<header><h1><span class="tit" onclick="if(LISTA&&LISTA.length)inicio()" title="Ir al inicio">🎓 Panel CSA <span>Gauss</span></span></h1><button id="volver" onclick="inicio()">⬅ Inicio</button></header>
<main><div id="app"></div><div id="msg">Cargando…</div></main>
<script>
// ===== Links de las dos aplicaciones web =====
var API_CSA='https://script.google.com/macros/s/AKfycbxkJKfreWnlk8OZjS18maXcKNO4UblFEiaOwcBpe2VZYm5fs3CmlKEjwNqETak_ObJa/exec';   // ← el link de la aplicación web del CSA (termina en /exec)
var API_ADM='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';

var PIN='';try{PIN=localStorage.getItem('gaussPinCSA')||localStorage.getItem('gaussPin')||'';}catch(e){}
var LISTA=[],FC=null,FI=null,FB=null,PICK=null,PICK_CB=null,ACTUAL=null;
// ⚡ Supabase: copia rápida (solo lectura). Si falla o no está, se usa la planilla como siempre.
var SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI';
var NAV=0,TOCADO=false,NUEVO=null;
function sbLeer(tipo,clave,ok,mal){
 if(!PIN){mal();return;}
 var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);
 fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:String(clave)})})
 .then(function(r){return r.json();})
 .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})
 .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});}
function estable(o){if(Array.isArray(o))return '['+o.map(estable).join(',')+']';
 if(o&&typeof o==='object')return '{'+Object.keys(o).filter(function(k){return k!=='_ms'&&k!=='_total'&&o[k]!==undefined;}).sort()
  .map(function(k){return JSON.stringify(k)+':'+estable(o[k]);}).join(',')+'}';
 return JSON.stringify(o);}
function haceCuanto(t){var m=Math.round((Date.now()-new Date(t).getTime())/60000);return isNaN(m)?'':(m<1?'recién':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h');}
function sbMarca(h){var m=el('sbMarca');if(!m){m=document.createElement('div');m.id='sbMarca';m.style.cssText='font-size:12px;color:#777;text-align:center;margin:0 0 8px';
  var a=el('app');a.parentNode.insertBefore(m,a);}m.innerHTML=h||'';}
// Muestra la copia de Supabase al instante y después confirma con la planilla.
// "refresco" (opcional): qué hacer con los datos nuevos de la planilla (si no, se vuelve a usar "ok").
function rapido(acc,params,tipo,clave,ok,mal,refresco){
 var n=++NAV;sbMarca('');
 sbLeer(tipo,clave,function(d,t){
  if(n!==NAV)return;TOCADO=false;ok(d);sbMarca('⚡ Vista rápida · confirmando con la planilla…');
  pedir(acc,params,function(D){
   if(n!==NAV)return;
   if(estable(D)===estable(d)){sbMarca('✅ Confirmado con la planilla');setTimeout(function(){if(n===NAV)sbMarca('');},2500);return;}
   var aplicar=function(){var y=window.scrollY;(refresco||ok)(D);window.scrollTo(0,y);sbMarca('');};
   if(!TOCADO||refresco){aplicar();return;}
   NUEVO=aplicar;sbMarca('<b style="color:#b45f06">🔄 La planilla tiene datos más nuevos.</b> <button onclick="NUEVO()" style="font-size:12px">Actualizar</button>');
  },function(e){if(n!==NAV)return;if(String(e.message||'').indexOf('PIN:')>=0){mal(e);return;}
   sbMarca('<span style="color:#c0392b">⚠️ No se pudo confirmar con la planilla (se ve la vista rápida).</span>');});
 },function(){if(n===NAV)pedir(acc,params,function(D){if(n===NAV)ok(D);},function(e){if(n===NAV)mal(e);});});}
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return 'Gs. '+Math.round(n).toLocaleString('es-PY');}
function num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}
function fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):(/0/.test(i.value)?'0':'');}   // se puede escribir 0
function fecha(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}
function msg(t){el('msg').innerHTML=t||'';}
function nombreDe(a){return String(a[0]).split(' · ').slice(1).join(' · ')||a[0];}

function llamar(api,donde,acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(api+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error,adm:donde==='adm'});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con '+(donde==='adm'?'Administración':'el CSA')+'. Revisá la conexión y probá de nuevo.'});});}
function pedir(acc,params,ok,mal){
 if(API_CSA.indexOf('PEGAR')===0){mal({message:'Falta pegar el link del CSA en este archivo (línea API_CSA).'});return;}
 llamar(API_CSA,'csa',acc,params,ok,mal);}
function pedirAdm(acc,params,ok,mal){llamar(API_ADM,'adm',acc,params,ok,mal);}
function falla(e,dest){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){
  if(e.adm)m='Administración no aceptó el PIN. Falta cargar el "PIN de CSA" en CONFIG de Administración (con la misma clave que este panel).';
  else{pedirPin(m.replace(/^.*PIN:\s*/,''));return true;}}
 if(dest)el(dest).innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';else msg('<span class="err">⚠️ '+esc(m)+'</span>');return false;}
function pedirPin(m){el('volver').style.display='none';msg('');
 el('app').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Panel CSA</h2><div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
 '<input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="font-size:22px;width:180px;text-align:center"><br><button class="btn" style="width:auto;display:inline-block;padding:12px 34px" onclick="entrar()">Entrar</button></div>';
 var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinCSA',PIN);cargar();}

function cargar(){el('app').innerHTML='';msg('Cargando alumnos…');
 function listo(){inicio();cargarAlertas();cargarCal();cargarExamenes();var pl=function(){pedir('formCSA',{},function(d){FC=d;},function(){});};
  sbLeer('csaForm','todo',function(d){if(d.hoy){var x=new Date();d.hoy=new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);}FC=d;pl();},pl);}
 sbLeer('csaLista','todo',function(l){LISTA=l;listo();
   pedir('lista',{},function(l2){LISTA=l2;},function(e){if(String(e.message||'').indexOf('PIN:')>=0)falla(e);});},
  function(){pedir('lista',{},function(l){LISTA=l;listo();},function(e){falla(e);});});}
el('app').addEventListener('input',function(){TOCADO=true;});
cargar();
function conFC(fn){if(FC)fn();else{msg('Cargando…');pedir('formCSA',{},function(d){FC=d;msg('');fn();},function(e){falla(e);});}}

// ◀ Volver atrás con el gesto del celular (deslizar) o la flecha del navegador: cada pantalla queda en el historial
var HIST=[],HIST_OK=!!(window.history&&history.pushState);
function guardarPantalla(){if(!HIST_OK||!el('app'))return;var v=el('volver')?el('volver').style.display:'';
 HIST.push({h:el('app').innerHTML,y:window.scrollY,v:v});if(HIST.length>30)HIST.shift();try{history.pushState({gauss:HIST.length},'');}catch(e){}}
window.addEventListener('popstate',function(){if(typeof NAV!=='undefined')NAV++;var s=HIST.pop();
 if(!s||s.v==='none'||s.v===''){HIST=[];inicio(true);return;}
 el('app').innerHTML=s.h;if(el('volver'))el('volver').style.display=s.v;if(typeof msg==='function')msg('');try{if(typeof sbMarca==='function')sbMarca('');}catch(e){}
 setTimeout(function(){window.scrollTo(0,s.y);},0);});
function pantalla(h){guardarPantalla();NAV++;sbMarca('');el('volver').style.display='inline-block';msg('');el('app').innerHTML=h;window.scrollTo(0,0);}
function hecho(t,botones){pantalla('<div class="card ok"><b class="big">✅ '+t+'</b>'+botones+
 '<button class="btn gr" onclick="inicio()">⬅ Volver al inicio</button></div>');}
function botonPerfil(){return ACTUAL?'<button class="btn az" onclick="perfil(\''+esc(ACTUAL[1])+'\')">👤 Volver al perfil de '+esc(nombreDe(ACTUAL))+'</button>':'';}

// ---------- INICIO ----------
function inicio(desdeHist){if(!desdeHist)HIST=[];NAV++;sbMarca('');el('volver').style.display='none';msg('');window.scrollTo(0,0);ACTUAL=null;
 el('app').innerHTML='<div id="avisosCal"></div><div class="botones">'+
  '<button class="bgrande" style="background:#1f4e79" onclick="buscarPerfil()">👤 Perfil del alumno<small>Asistencia, notas, seguimiento · informe para padres</small></button>'+
  '<button class="bgrande" id="bAlr" style="background:#b71c1c" onclick="alertas()">'+txtBotonAlr()+'</button>'+
  '<button class="bgrande" id="bExa" style="background:#6a1b9a" onclick="examenes()">'+txtBotonExa()+'</button>'+
  '<button class="bgrande" style="background:#1565c0" onclick="calendario()">📅 Calendario<small>Exámenes, días de lluvia, sin clase y otras actividades de la semana</small></button>'+
  '<button class="bgrande" style="background:#00838f" onclick="listaGrupo()">📊 Resumen de grupo<small>Semáforo, asistencia, notas y deuda de cada alumno</small></button>'+
  '<button class="bgrande" style="background:#c0392b" onclick="pdfNotas()">🖨️ PDF de notas<small>Notas de un grupo: un examen o todos</small></button>'+
  '<button class="bgrande" style="background:#2e7d32" onclick="justificativo()">🩺 Justificativo<small>Cuando avisan que faltó o va a faltar</small></button>'+
  '<button class="bgrande" style="background:#ad1457" onclick="observacion()">📝 Anotar observación<small>Seguimiento, conducta, citación, algo positivo…</small></button>'+
  '<button class="bgrande" style="background:#e65100" onclick="contacto()">📞 Registrar contacto<small>Hablé con el alumno o con su familia</small></button>'+
  '<button class="bgrande" style="background:#6a1b9a" onclick="cambiarGrupo()">🔄 Cambiar de grupo<small>Pasar a un alumno a otro grupo</small></button>'+
  '<button class="bgrande" style="background:#455a64" onclick="baja()">🚪 Salió del grupo<small>Cuando un alumno deja el cursillo</small></button>'+
  '<button class="bgrande" style="background:#37474f" onclick="cargasSemana()">📒 Cargas de la semana<small>Observaciones, contactos, justificativos… de sábado a viernes</small></button>'+
  '</div><div class="ayuda" style="text-align:center;margin-top:16px">'+LISTA.length+' alumnos · datos del CSA (se actualizan cada hora)</div>';pintarAvisos();}

// ---------- 📅 CALENDARIO ----------
var CAL=null,CAL_OFF=0,CAL_ED=null;
var CAL_TIPO={'Examen':['📝','#6a1b9a','#efe3f7'],'Lluvia':['🌧️','#1565c0','#e3f0fc'],'Sin clase':['🚫','#616161','#eeeeee'],'Otro':['📌','#e65100','#fff0e0']};
var DSEM=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function isoMas(iso,n){return isoMenos(iso,-n);}
function dowIso(iso){var q=iso.split('-').map(Number);return new Date(Date.UTC(q[0],q[1]-1,q[2])).getUTCDay();}
function ddmmIso(iso){var p=iso.split('-');return p[2]+'/'+p[1];}
// lunes de la semana que se muestra: el domingo ya muestra la semana que empieza
function calLunes(){var h=(CAL&&CAL.hoy)||hoyIso(),d=dowIso(h),l=d===0?isoMas(h,1):isoMenos(h,d-1);return isoMas(l,7*CAL_OFF);}
function calTxt(x){var t=CAL_TIPO[x.tipo]||CAL_TIPO.Otro;
 return t[0]+' '+(x.tipo==='Examen'?'Examen '+esc(x.materia):x.tipo==='Otro'?esc(x.nombre):x.tipo==='Lluvia'?'Día de lluvia':'Sin clase')+
  ' · '+esc(x.grupos.join(', '));}
function cargarCal(){var pon=function(d){CAL=d;pintarAvisos();};
 sbLeer('csaCal','todo',function(d){pon(d);pedir('calendario',{},pon,function(){});},function(){pedir('calendario',{},pon,function(){});});}
// Avisos en el inicio: hoy y los próximos 6 días
function pintarAvisos(){var b=el('avisosCal');if(!b||!CAL)return;var h=CAL.hoy,fin=isoMas(h,6);
 var l=CAL.items.filter(function(x){return x.iso>=h&&x.iso<=fin&&(x.tipo!=='Sin clase'||x.grupos.indexOf('Todos')>=0);});
 if(!l.length){b.innerHTML='';return;}
 b.innerHTML='<div class="card" style="border-left:6px solid #1565c0;cursor:pointer" onclick="calendario()"><b>📅 Próximos días</b>'+
  l.slice(0,6).map(function(x){var t=CAL_TIPO[x.tipo]||CAL_TIPO.Otro;
   return '<div style="margin-top:6px;padding:6px 8px;border-radius:8px;background:'+t[2]+'"><b>'+(x.iso===h?'HOY':DSEM[x.dow].slice(0,3)+' '+esc(x.fecha))+'</b> · '+
    (x.turno==='Todo el día'?'todo el día':x.turno==='Mañana'?'☀️ mañana':'🌙 tarde')+'<br>'+calTxt(x)+(x.nota?' <span class="ayuda">· '+esc(x.nota)+'</span>':'')+'</div>';}).join('')+
  (l.length>6?'<div class="ayuda" style="margin-top:4px">y '+(l.length-6)+' más…</div>':'')+
  '<div class="ayuda" style="margin-top:6px">Tocá para ver el calendario</div></div>';}
function calendario(){pantalla('<div class="card">Cargando calendario…</div>');
 rapido('calendario',{},'csaCal','todo',function(d){CAL=d;pintarCal();},function(e){falla(e);});}
function calMover(n){CAL_OFF=n===0?0:CAL_OFF+n;pintarCal();window.scrollTo(0,0);}
function pintarCal(){if(!CAL)return;var lun=calLunes(),sab=isoMas(lun,5),hoy=CAL.hoy;
 var h='<div class="card"><h2>📅 Calendario</h2><div style="font-size:17px;font-weight:bold;text-align:center">Semana del '+ddmmIso(lun)+' al '+ddmmIso(sab)+(CAL_OFF===0?' <span class="ayuda">(esta semana)</span>':'')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:10px"><button class="mini" style="flex:1;padding:11px" onclick="calMover(-1)">◀ Anterior</button>'+
  '<button class="mini" style="flex:1;padding:11px;background:#1565c0" onclick="calMover(0)">Hoy</button>'+
  '<button class="mini" style="flex:1;padding:11px" onclick="calMover(1)">Siguiente ▶</button></div>'+
  '<div class="ayuda" style="margin-top:8px">📝 Examen: el que falta a la lista de ese turno sale en "Ausencias en exámenes". 🌧️ Lluvia y 🚫 Sin clase: la lista se llama igual, pero ese turno no cuenta para nada (% de asistencia, faltas seguidas, resumen).</div></div>';
 for(var i=0;i<6;i++){var iso=isoMas(lun,i),es=iso===hoy,del=CAL.items.filter(function(x){return x.iso===iso;});

function alrIso(x){var hoy=(ALR&&ALR.hoy)||hoyIso(),p=String(x.fecha||'').split('/');if(p.length<2)return '';var y=Number(hoy.slice(0,4));
 if(Number(p[1])>Number(hoy.slice(5,7)))y--;return y+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[0]).slice(-2);}
function isoMenos(iso,n){var q=iso.split('-').map(Number),d=new Date(Date.UTC(q[0],q[1]-1,q[2]-n));return d.toISOString().slice(0,10);}

function alrEnRango(x){var r=alrRango(),i=alrIso(x);return !i||(i>=r[0]&&i<=r[1]);}

 if(!confirm('¿Registrar que '+nombreDe(a)+' ('+(a[2]||'')+') salió?\n\nAvisó el '+fecha(el('bA').value)+(el('bF').value?'\nVino por última vez el '+fecha(el('bF').value):'')))return;
 var b=el('bB');b.disabled=true;b.textContent='Guardando…';ACTUAL=a;
 pedirAdm('baja',{id:a[1],fecha:el('bF').value,ultima:el('bF').value,aviso:el('bA').value,motivo:el('bM').value,obs:el('bO').value,quien:quienSoy()},function(r){a[3]='Salió';
   hecho(esc(r.nombre)+' salió de '+esc(r.grupo)+' desde el '+esc(r.fecha)+'.<br><span style="font-weight:normal;font-size:15px">Acordate de sacarlo del grupo de WhatsApp.</span>',otroBoton('🚪 Registrar otra salida','baja'));},
  function(e){b.disabled=false;b.textContent='🚪 Confirmar salida';falla(e,'bMsg');});}

// ---------- 📒 CARGAS DE LA SEMANA ----------
var CS_MODO='0';
function cargasSemana(){pantalla('<div class="card"><h2>📒 Cargas de la semana</h2><div class="cs-sem">'+
  '<button id="cs0" onclick="csIr(\'0\')">Esta semana</button><button id="cs1" onclick="csIr(\'1\')">Semana anterior</button><button id="csX" onclick="csIr(\'x\')">Elegir fechas</button></div>'+
  '<div id="csF" style="display:none;margin-top:8px"><div class="fila'+'2'+'"><div><label>Desde</label><input type="date" id="csD"></div><div><label>Hasta</label><input type="date" id="csH"></div></div>'+
  '<button class="btn" style="margin-top:10px" onclick="csVer({desde:el(\'csD\').value,hasta:el(\'csH\').value})">Ver</button></div>'+
  '<div class="ayuda" style="margin-top:6px">La semana va de sábado a viernes. <button class="mini" id="csOrd" onclick="csCambiarOrden()" style="margin-left:6px">'+csOrdTxt()+'</button></div></div><div id="csR"></div>');csIr(CS_MODO==='x'?'0':CS_MODO);}
// orden de las cargas: por defecto lo último cargado arriba (el servidor manda de más viejo a más nuevo)
var CS_ORDEN=guardado('gaussCsOrden')||'nuevo',CS_ULT=null;
function csOrdTxt(){return CS_ORDEN==='nuevo'?'↓ Más nuevos primero':'↑ Más viejos primero';}
function csCambiarOrden(){CS_ORDEN=CS_ORDEN==='nuevo'?'viejo':'nuevo';guardado('gaussCsOrden',CS_ORDEN);var b=el('csOrd');if(b)b.textContent=csOrdTxt();if(CS_ULT&&el('csL'))csListas();}
function csOrdenar(R){var X={};Object.keys(R).forEach(function(k){X[k]=Array.isArray(R[k])&&k!=='medios'&&CS_ORDEN==='nuevo'?R[k].slice().reverse():R[k];});return X;}
function csIr(m){CS_MODO=m;['0','1','X'].forEach(function(k){var b=el('cs'+k);if(b)b.className=(k===m||(k==='X'&&m==='x'))?'on':'';});
 el('csF').style.display=m==='x'?'block':'none';if(m!=='x')csVer({anterior:m});}
function csVer(p){el('csR').innerHTML='<div class="card">Cargando… (unos segundos)</div>';
 CS_PEDIR('cargasSemana',p,function(R){el('csR').innerHTML=csPintar(R);if(el('csD')&&!el('csD').value){el('csD').value=R.desdeIso;el('csH').value=R.hastaIso;}},function(e){falla(e,'csR');});}
function csTabla(tit,enc,filas,der){der=der||[];return '<div class="card"><h2>'+tit+' <span class="ayuda">('+filas.length+')</span></h2>'+(filas.length?'<div style="overflow-x:auto"><table class="cs-tb"><tr>'+
  enc.map(function(e,i){return '<th'+(der.indexOf(i)>=0?' class="n"':'')+'>'+esc(e)+'</th>';}).join('')+'</tr>'+filas.map(function(f){return '<tr>'+f.map(function(c,i){return '<td'+(der.indexOf(i)>=0?' class="n"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+
  '</table></div>':'<div class="ayuda">— nada cargado —</div>')+'</div>';}
function csK(t,v){return '<div class="cs-k"><span>'+esc(t)+'</span><b>'+v+'</b></div>';}
function csMil(n){return Math.round(Number(n)||0).toLocaleString('es-PY');}

function CS_PEDIR(a,p,ok,mal){if(p.desde||p.hasta){NAV++;sbMarca('');pedir(a,p,ok,mal);return;}rapido(a,p,'csaCargas',p.anterior==='1'?'anterior':'actual',ok,mal);}
function csPintar(R){CS_ULT=R;CS_LIM={obs:10,contactos:10,justif:10,informes:10};
 var h='<div class="card"><h2>Del '+esc(R.desde)+' al '+esc(R.hasta)+'</h2><div class="cs-res">'+
  csK('Observaciones',R.obs.length)+csK('Contactos',csContactos(R.contactos).length)+csK('Justificativos',R.justif.length)+csK('Informes padres',R.informes.length)+'</div>'+
  '<label>🔎 Buscar un alumno en estas cargas</label><input id="csQ" placeholder="Apellido, nombre o ID…" value="'+esc(CS_Q)+'" oninput="CS_Q=this.value;csListas()" autocomplete="off">'+
  '<div class="ayuda" style="margin-top:6px">Busca en el período elegido. Para buscar más atrás, usá "Elegir fechas". Tocá un nombre para abrir su perfil.</div></div><div id="csL">'+csSecciones()+'</div>';
 return h;}
var CS_Q='',CS_LIM={obs:10,contactos:10,justif:10,informes:10};
function csListas(){var y=window.scrollY;if(el('csL'))el('csL').innerHTML=csSecciones();window.scrollTo(0,y);}
function csMas(k){CS_LIM[k]+=10;csListas();}
// un contacto marcado desde las alertas queda 2 veces (con quién + "Resuelta"): se muestra en una sola fila
function csContactos(l){var M={},out=[];(l||[]).forEach(function(x){var k=[x.id,x.dia,x.motivo,x.medio,x.nota].join('|');
  if(M[k]){if(!/^Resuelta/.test(x.aquien)&&M[k].aquien.indexOf(x.aquien)<0)M[k].aquien=(/^Resuelta/.test(M[k].aquien)?x.aquien:M[k].aquien+' · '+x.aquien);M[k].res=M[k].res||/^Resuelta/.test(x.aquien);return;}
  var y={};for(var z in x)y[z]=x[z];y.res=/^Resuelta/.test(x.aquien);M[k]=y;out.push(y);});
 out.forEach(function(x){if(x.res&&!/^Resuelta/.test(x.aquien))x.aquien+=' ✔';else if(/^Resuelta/.test(x.aquien))x.aquien='✔ Resuelta';});return out;}
function csSecciones(){var R=csOrdenar(CS_ULT),q=sa(CS_Q.trim()),pal=q?q.split(/\s+/):[];
 var al=function(x){return x.id&&alumno(x.id)?'<span class="cs-al" onclick="perfil(\''+esc(x.id)+'\')">'+esc(x.alumno)+'</span>':esc(x.alumno);};
 var ok=function(x){if(!pal.length)return true;var t=sa((x.alumno||'')+' '+(x.id||''));return pal.every(function(w){return t.indexOf(w)>=0;});};
 var sec=function(k,tit,enc,lista,fila){var l=lista.filter(ok),n=CS_LIM[k],vis=pal.length?l:l.slice(0,n);
  var h=csTabla(tit,enc,vis.map(fila));h=h.replace('<span class="ayuda">('+vis.length+')</span>','<span class="ayuda">('+l.length+')</span>');
  if(!pal.length&&l.length>n)h=h.replace(/<\/div>$/,'<button class="mini" style="margin-top:8px" onclick="csMas(\''+k+'\')">⬇ Ver 10 más (quedan '+(l.length-n)+')</button></div>');
  return h;};
 return sec('obs','📝 Observaciones',['Día','Alumno','Tipo','Detalle','Resultado','Anotó'],R.obs,function(x){return [esc(x.dia),al(x),esc(x.tipo),esc(x.detalle),esc(x.resultado),esc(x.quien)];})+
  sec('contactos','📞 Contactos',['Día','Alumno','Con quién','Motivo','Por','Nota'],csContactos(R.contactos),function(x){return [esc(x.dia),al(x),esc(x.aquien),esc(x.motivo),esc(x.medio),esc(x.nota)];})+
  sec('justif','🩺 Justificativos',['Cargado','Alumno','Desde','Hasta','Motivo','Quién justificó','A quién'],R.justif,function(x){return [esc(x.dia),al(x),esc(x.desde),esc(x.hasta),esc(x.motivo),esc(x.quien),esc(x.aquien)];})+
  sec('informes','📄 Informes para padres',['Día','Alumno','Grupo','Generado por'],R.informes,function(x){return [esc(x.dia),al(x),esc(x.grupo),esc(x.quien)];});}
</script></body></html>
